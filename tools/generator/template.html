<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--mute:#777;--acc:__ACC__;--acc2:#1971c2;--line:#e2e0da}
@media (prefers-color-scheme:dark){:root{--bg:#18181b;--card:#232327;--ink:#eee;--mute:#999;--line:#38383d}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Hiragino Sans","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{padding:20px 16px 8px;max-width:920px;margin:auto}h1{font-size:1.4rem;margin:0 0 4px}header p{margin:4px 0;color:var(--mute);font-size:.92rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.bar .in{max-width:920px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:.92rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--ink);padding:6px 10px;cursor:pointer;font:inherit}.seg button.on{background:var(--acc2);color:#fff}
input[type=range]{width:120px;vertical-align:middle}label{cursor:pointer}
main{max-width:920px;margin:auto;padding:8px 16px 40px}
.grp{margin:26px 0 4px;padding-left:10px;border-left:5px solid var(--acc)}.grp h2{margin:0;font-size:1.2rem}.grp p{margin:2px 0;color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.card.playing{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.num{font-weight:700;color:var(--acc);min-width:2.2em}
.title{font-weight:700;font-size:1.05rem}.title.hid{color:var(--mute);font-weight:400;font-style:italic}
.tag{font-size:.78rem;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.btn.play{background:var(--acc);border-color:var(--acc);color:#fff;min-width:84px}.spacer{flex:1}
.lyr{margin-top:10px;font-size:1.25rem;letter-spacing:.06em;line-height:2.1}.lyr span{padding:0 2px;border-radius:4px;display:inline-block;text-align:center}.lyr span small{display:block;font-size:.62rem;color:var(--mute);line-height:1;letter-spacing:0}
.lyr span.sing{background:var(--acc);color:#fff}.lyr span.sing small{color:#fff}.lyr .sep{color:var(--mute);margin:0 .4em}.nolyr .lyr{display:none}
.ans{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}.card.rev .ans{display:block}
.gw{overflow-x:auto}.grid{display:grid;gap:2px;margin:4px 0}.cell{height:28px;border-radius:3px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.cell.beat{box-shadow:inset 2px 0 0 color-mix(in srgb,var(--ink) 35%,transparent)}.cell.barstart{box-shadow:inset 3px 0 0 var(--acc2)}
.cell.on{background:var(--acc)}.vgrid .cell.on{color:#fff;font-size:.68rem;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}.cell.hold{background:color-mix(in srgb,var(--acc) 40%,transparent)}
.cell.now{outline:2px solid var(--acc2);outline-offset:-2px}
.lbl{display:grid;gap:2px;font-size:.62rem;color:var(--mute);text-align:center}
.drow .cell{height:11px}.drow .cell.on{background:var(--acc2)}.drow .cell.on2{background:color-mix(in srgb,var(--acc2) 45%,transparent)}
.rowname{font-size:.74rem;color:var(--mute);margin-top:6px}
.count{font-family:ui-monospace,Menlo,monospace;background:color-mix(in srgb,var(--ink) 6%,transparent);padding:6px 8px;border-radius:6px;font-size:.84rem;overflow-x:auto;white-space:pre}.count b{color:var(--acc)}
.ans p{margin:8px 0}.ans .k{color:var(--acc2);font-weight:700}
#quizbox{display:none;background:var(--card);border:2px solid var(--acc2);border-radius:12px;padding:14px 16px;margin:14px 0}.quizmode #quizbox{display:block}
#quizbox .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}#quizbox .right{background:#2f9e44;color:#fff;border-color:#2f9e44}#quizbox .wrong{background:#e03131;color:#fff;border-color:#e03131}
footer{max-width:920px;margin:auto;padding:0 16px 40px;color:var(--mute);font-size:.86rem}
</style></head><body>
<header><h1>__TITLE__</h1>__INTRO__
<p>人聲為母音合成（機器聲），歌詞為原創。每種節奏 2 小節一循環，有自己的建議速度，可用「速度倍率」整體放慢。整理日期：2026-11-10 ・ 分類：音樂分析 / 節奏感訓練</p></header>
<div class="bar"><div class="in">
 <span class="seg" id="mix"><button data-m="both" class="on">人聲＋鼓</button><button data-m="voc">只人聲</button><button data-m="drum">只鼓</button></span>
 <span>速度倍率 <input type="range" id="spd" min="50" max="120" value="100" step="5"> <b id="spdv">100%</b></span>
 <label><input type="checkbox" id="click"> 節拍器</label>
 <label><input type="checkbox" id="countin" checked> 先數 1 小節</label>
 <label><input type="checkbox" id="loop" checked> 循環</label>
 <label><input type="checkbox" id="showly" checked> 顯示歌詞</label>
 <label><input type="checkbox" id="hide"> 盲聽</label>
 <button class="btn" id="quizbtn">🎲 隨機考我</button>
</div></div>
<main id="main"><div id="quizbox"></div></main>
<footer>__FOOTER__<p>格子圖例：橘＝人聲起音（格內是字），淺橘＝延長，藍＝鼓；藍粗線＝小節開頭，灰線＝每一拍。</p></footer>
<script>
const GROUPS=__GROUPS__;
const DR=__DRUMS__;
const P=__PATTERNS__;
function posStr(n,arr){const a=Array(n).fill(".");(arr||[]).forEach(x=>{const p=Array.isArray(x)?x[0]:x;a[p]="x"});return a.join("")}
for(const k in DR){const d=DR[k],n=d.sub*4;d.K=posStr(n,d.k);d.S=posStr(n,d.s);d.C=posStr(n,d.c);d.H=posStr(n,d.h);d.O=posStr(n,d.o);d.B={};(d.b||[]).forEach(x=>d.B[x[0]]=x)}
function parse(str){const s=str.replace(/\|/g,"");const notes=[];for(let i=0;i<s.length;i++){if(s[i]==="x"){let j=i+1;while(j<s.length&&s[j]==="-")j++;notes.push({st:i,len:j-i})}}return {s,notes}}
function defMel(n,rap){const out=[];const A=rap?[0,0,1,0,2,1,0,1]:[0,2,4,2,4,5,4,2,0,2,4,7,5,4,2];for(let i=0;i<n;i++)out.push(A[i%A.length]);out[n-1]=rap?-1:0;return out}
P.forEach(p=>{const r=parse(p.v);p.s=r.s;p.notes=r.notes;p.steps=p.sub*8;p.drum=DR[p.dr];p.noteAt={};p.notes.forEach((n,k)=>p.noteAt[n.st]=k);p.mel=p.mel||defMel(p.notes.length,p.rap);
 if(p.drum.sub!==p.sub||p.s.length!==p.steps||p.ly.length!==p.notes.length)console.error("資料不符",p.t,p.s.length,p.steps,p.ly.length,p.notes.length)});
const main=document.getElementById("main");
function labels(sub){const L=sub===4?["e","&","a"]:sub===3?["la","li"]:["","","&","",""];const a=[];for(let b=0;b<2;b++)for(let q=1;q<=4;q++){a.push(String(q));L.forEach(x=>a.push(x))}return a}
function cls0(p,i){const c=["cell"];if(i%p.sub===0)c.push(i%(p.sub*4)===0?"barstart":"beat");return c}
function gridHTML(p){const n=p.steps,lb=labels(p.sub),col=`grid-template-columns:repeat(${n},minmax(${p.sub===6?11:15}px,1fr))`;let v="",l="";
 for(let i=0;i<n;i++){const c=p.s[i],cl=cls0(p,i);if(c==="x")cl.push("on");else if(c==="-")cl.push("hold");v+=`<div class="${cl.join(" ")}" data-i="${i}">${c==="x"?p.ly[p.noteAt[i]]:""}</div>`;l+=`<div>${i%p.sub===0?"<b>"+lb[i]+"</b>":lb[i]}</div>`}
 const d=p.drum,row=(nm,a,b2)=>{let h="";for(let i=0;i<n;i++){const j=i%(p.sub*4),cl=cls0(p,i);if(a[j]==="x")cl.push("on");else if(b2&&b2[j]==="x")cl.push("on2");h+=`<div class="${cl.join(" ")}"></div>`}return `<div class="rowname">${nm}</div><div class="grid drow" style="${col}">${h}</div>`};
 const bs=posStr(p.sub*4,(d.b||[]).map(x=>x[0]));
 return `<div class="gw"><div class="rowname">人聲</div><div class="grid vgrid" style="${col}">${v}</div><div class="lbl" style="${col}">${l}</div>`+row("Hi-hat（淺色＝開鈸）",d.H,d.O)+row("小鼓（淺色＝拍手／邊擊）",d.S,d.C)+row(d.b?"踢鼓（淺色＝808 低音）":"踢鼓",d.K,bs)+`</div>`}
function countText(p){const lb=labels(p.sub);let out="";for(let i=0;i<p.steps;i++){if(i===p.sub*4)out+="| ";const c=p.s[i],t=lb[i]||"○";if(p.sub===6&&c!=="x"&&!lb[i])continue;out+=(c==="x"?`<b>${t}</b>`:c==="-"?"~":"·")+" "}return out}
function lyrHTML(p){return p.ly.map((ch,k)=>(k===p.b1?'<span class="sep">/</span>':'')+`<span data-n="${k}">${ch}${p.rm?`<small>${p.rm[k]}</small>`:""}</span>`).join("")}
let lastG=null;
P.forEach((p,i)=>{if(p.g!==lastG){lastG=p.g;const g=GROUPS[p.g];const h=document.createElement("div");h.className="grp";h.innerHTML=`<h2>${g.name}</h2><p>${g.desc}</p>`;main.appendChild(h)}
 const c=document.createElement("div");c.className="card";c.id="c"+i;
 c.innerHTML=`<div class="top"><span class="num">#${i+1}</span><span class="title" data-t="${p.t}">${p.t}</span><span class="tag ttag">${p.bpm} BPM</span><span class="spacer"></span><button class="btn play">▶ 播放</button><button class="btn rv">揭曉答案</button></div>
 <div class="lyr">${lyrHTML(p)}</div>
 <div class="ans"><p><span class="k">節奏型：</span>${p.t}　<span class="tag">流派：${GROUPS[p.g].name}</span> <span class="tag">鼓：${p.drum.name}</span></p>${gridHTML(p)}
 <p class="rowname">數拍唸法（粗體＝人聲起音，~＝延長，·＝休止${p.sub===6?"，○＝三連音中間的點":""}）：</p><div class="count">${countText(p)}</div>
 <p><span class="k">味道：</span>${p.ex}</p><p><span class="k">聽的重點：</span>${p.how}</p>${p.ref?`<p><span class="k">類似風格可以聽：</span>${p.ref}</p>`:""}</div>`;
 c.querySelector(".play").onclick=()=>toggle(i);c.querySelector(".rv").onclick=e=>{c.classList.toggle("rev");e.target.textContent=c.classList.contains("rev")?"收起答案":"揭曉答案"};main.appendChild(c)});
const $=id=>document.getElementById(id);
$("hide").onchange=()=>{const h=$("hide").checked;document.querySelectorAll(".card .title").forEach(t=>{t.textContent=h?"（名稱已隱藏，先聽再猜）":t.dataset.t;t.classList.toggle("hid",h)})};
$("showly").onchange=e=>document.body.classList.toggle("nolyr",!e.target.checked);
let mix="both";document.querySelectorAll("#mix button").forEach(b=>b.onclick=()=>{mix=b.dataset.m;document.querySelectorAll("#mix button").forEach(x=>x.classList.toggle("on",x===b))});
$("spd").oninput=()=>$("spdv").textContent=$("spd").value+"%";
__AUDIO__
function bass808(t,dur,glide){const o=ctx.createOscillator(),g=ctx.createGain();const f=55;if(glide){o.frequency.setValueAtTime(f*1.5,t);o.frequency.exponentialRampToValueAtTime(f,t+.12)}else o.frequency.setValueAtTime(f,t);
 const sh=ctx.createWaveShaper();const cv=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;cv[i]=Math.tanh(2.2*x)}sh.curve=cv;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.7,t+.01);g.gain.setValueAtTime(.6,Math.max(t+.02,t+dur-.05));g.gain.exponentialRampToValueAtTime(.001,t+dur+.05);o.connect(sh);sh.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1)}
function clap(t){[0,.012,.024].forEach(d=>noise(t+d,.09,"bandpass",1200,.35))}
function ohat(t){noise(t,.22,"highpass",7000,.14)}
let cur=-1,timer=null,nextT=0,step=0,inCount=0,visQ=[],raf=null,onEnd=null;
function bpmOf(p){return p.bpm*$("spd").value/100}
function toggle(i,cb){initAudio();ctx.resume();if(cur===i){stop();return}stop();cur=i;onEnd=cb||null;const p=P[i];
 $("c"+i).classList.add("playing");setBtn(i,"■ 停止");step=0;inCount=$("countin").checked?4:0;nextT=ctx.currentTime+.08;timer=setInterval(sched,25);sched();raf=requestAnimationFrame(draw)}
function setBtn(i,t){const b=document.querySelector("#c"+i+" .play");if(b)b.textContent=t}
function stop(){if(cur<0)return;clearInterval(timer);cancelAnimationFrame(raf);$("c"+cur).classList.remove("playing");setBtn(cur,"▶ 播放");document.querySelectorAll(".cell.now,.lyr .sing").forEach(c=>c.classList.remove("now","sing"));const cb=onEnd;cur=-1;visQ=[];onEnd=null;if(cb)cb()}
function sched(){const p=P[cur];while(nextT<ctx.currentTime+.12){const beat=60/bpmOf(p),sd=beat/p.sub;
 if(inCount>0){clickS(nextT,inCount===4);inCount--;nextT+=beat;continue}
 if(step>=p.steps){if($("loop").checked)step=0;else{const t=nextT;setTimeout(()=>{if(cur>=0&&P[cur]===p)stop()},(t-ctx.currentTime)*1000+200);nextT=1e9;return}}
 const s=step,bs=s%(p.sub*4),d=p.drum;
 if(mix!=="voc"){if(d.K[bs]==="x")kick(nextT);if(d.S[bs]==="x")snare(nextT);if(d.C[bs]==="x")clap(nextT);if(d.H[bs]==="x")hat(nextT,bs%p.sub===0);if(d.O[bs]==="x")ohat(nextT);const b=d.B[bs];if(b)bass808(nextT,b[1]*sd,!!b[2])}
 if(mix!=="drum"&&p.noteAt[s]!==undefined){const j=p.noteAt[s],n=p.notes[j];let dur=n.len*sd;if(p.rap)dur=Math.min(dur,Math.max(sd*.9,.11));voice(nextT,dur,p.mel[j%p.mel.length],s%p.sub===0,p.vw[j],!p.cont||!p.cont[j])}
 if($("click").checked&&s%p.sub===0)clickS(nextT,bs===0);
 visQ.push({t:nextT,s});step++;nextT+=sd}}
function draw(){if(cur<0)return;const now=ctx.currentTime;let s=-1;while(visQ.length&&visQ[0].t<=now)s=visQ.shift().s;
 if(s>=0){const p=P[cur];document.querySelectorAll("#c"+cur+" .vgrid .cell").forEach(c=>c.classList.toggle("now",+c.dataset.i===s));let k=-1;for(const n of p.notes)if(s>=n.st&&s<n.st+n.len){k=p.noteAt[n.st];break}
  document.querySelectorAll("#c"+cur+" .lyr span[data-n]").forEach(e=>e.classList.toggle("sing",+e.dataset.n===k))}raf=requestAnimationFrame(draw)}
const qb=$("quizbox");let qi=-1;
$("quizbtn").onclick=()=>{document.body.classList.add("quizmode");newQ();qb.scrollIntoView({behavior:"smooth"})};
function newQ(){stop();let n;do{n=Math.floor(Math.random()*P.length)}while(n===qi&&P.length>1);qi=n;const o=new Set([n]);while(o.size<4)o.add(Math.floor(Math.random()*P.length));const arr=[...o].sort(()=>Math.random()-.5);
 qb.innerHTML=`<b>🎲 盲聽測驗</b>：這是哪一種節奏型？<div style="margin-top:8px"><button class="btn play" id="qplay">▶ 播放題目</button> <button class="btn" id="qnext">換一題</button> <button class="btn" id="qclose">關閉</button></div><div class="opts">${arr.map(k=>`<button class="btn" data-k="${k}">${P[k].t}</button>`).join("")}</div><div id="qres" style="margin-top:8px"></div>`;
 $("qplay").onclick=()=>{if(cur===qi){stop();return}toggle(qi,()=>{$("qplay")&&($("qplay").textContent="▶ 播放題目")});$("qplay").textContent="■ 停止"};
 $("qnext").onclick=newQ;$("qclose").onclick=()=>{stop();document.body.classList.remove("quizmode")};
 qb.querySelectorAll(".opts .btn").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;qb.querySelectorAll(".opts .btn").forEach(x=>{if(+x.dataset.k===qi)x.classList.add("right")});if(k!==qi)b.classList.add("wrong");
  $("qres").innerHTML=(k===qi?"✅ 答對了！":"❌ 再聽聽看。")+` 正解是 <b>#${qi+1} ${P[qi].t}</b>（${GROUPS[P[qi].g].name}），<a href="#c${qi}">跳到該卡片</a>。`})}
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();if(cur>=0)stop()}});
</script></body></html>

<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人聲節奏聽感練習</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--mute:#777;--acc:#d9480f;--line:#e2e0da}
@media (prefers-color-scheme:dark){:root{--bg:#18181b;--card:#232327;--ink:#eee;--mute:#999;--line:#38383d}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px 0;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
nav .brand{font-weight:800;padding:8px 12px 8px 4px;white-space:nowrap}
nav a{white-space:nowrap;padding:8px 14px;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;color:var(--mute);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--ink)}nav a.on{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:700;margin-bottom:-1px;box-shadow:inset 0 3px 0 var(--c)}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
</style></head><body>
<nav id="tabs"><span class="brand">🎵 人聲節奏練習</span></nav>
<iframe id="view" title="練習頁" allow="autoplay"></iframe>
<script>try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}

const TABS=[
 {id:"pop",name:"流行 13 種",src:"pages/pop.html",c:"#d9480f"},
 {id:"song",name:"完整歌曲《夜風》",src:"pages/full-song.html",c:"#d9480f"},
 {id:"rap",name:"饒舌流派",src:"pages/rap.html",c:"#7048e8"},
 {id:"jpop",name:"J-POP",src:"pages/jpop.html",c:"#e64980"},
 {id:"rnb",name:"R&B",src:"pages/rnb.html",c:"#0c8599"},
 {id:"langzi",name:"《浪子回頭》",src:"pages/langzi.html",c:"#5f3dc4"},
 {id:"metro",name:"⏱️ 節拍器校準",src:"pages/metronome.html",c:"#2f9e44"}
];
const nav=document.getElementById("tabs"),view=document.getElementById("view");
TABS.forEach(t=>{const a=document.createElement("a");a.href="#"+t.id;a.textContent=t.name;a.dataset.id=t.id;a.style.setProperty("--c",t.c);nav.appendChild(a)});
function show(){const id=location.hash.slice(1);const t=TABS.find(x=>x.id===id)||TABS[0];
 nav.querySelectorAll("a").forEach(a=>a.classList.toggle("on",a.dataset.id===t.id));
 if(view.getAttribute("src")!==t.src)view.setAttribute("src",t.src);document.title=t.name+"・人聲節奏聽感練習"}
addEventListener("hashchange",show);show();
</script></body></html>

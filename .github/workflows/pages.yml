name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site with version number
        run: |
          VERSION="$(TZ=Asia/Taipei date +%Y.%m.%d).${{ github.run_number }}"
          mkdir _site
          cp -r index.html audition.html pages _site/ && { [ -d assets ] && cp -r assets _site/ || true; }
          BADGE="<div id=\"site-version\" style=\"position:fixed;right:6px;bottom:4px;font:11px sans-serif;color:#888;background:rgba(255,255,255,.8);padding:1px 6px;border-radius:4px;z-index:9999;pointer-events:none\">版本 ${VERSION}</div>"
          sed -i "s|</body>|${BADGE}</body>|" _site/index.html _site/audition.html
          grep -q "版本 ${VERSION}" _site/index.html
          echo "Version: ${VERSION}"
      - name: Build sample voices for audition page
        continue-on-error: true
        run: |
          pip install -q piper-tts numpy
          python tools/voices/build_voices.py _site/voices
          ls -la _site/voices
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

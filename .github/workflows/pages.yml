name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site with version number
        run: |
          VERSION="$(TZ=Asia/Taipei date +%Y.%m.%d).${{ github.run_number }}"
          mkdir _site
          cp -r index.html pages _site/
          BADGE="<div id=\"site-version\" style=\"position:fixed;right:6px;bottom:4px;font:11px sans-serif;color:#888;background:rgba(255,255,255,.8);padding:1px 6px;border-radius:4px;z-index:9999;pointer-events:none\">版本 ${VERSION}</div>"
          sed -i "s#</body>#${BADGE}</body>#" _site/index.html
          grep -q "版本 ${VERSION}" _site/index.html
          echo "Version: ${VERSION}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

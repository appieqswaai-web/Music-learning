<header><h1>《浪子回頭》人聲節奏練習</h1>
<p>茄子蛋〈浪子回頭〉（黃奇斌 詞曲），照樂譜整理的人聲節奏：4/4 拍、Slow Soul、♩≈62。人聲是母音合成的機器聲，音高是通用的練習音高，不是原曲旋律；每句只顯示開頭兩個字當提示（● 是其他字），請搭配原曲一起練。</p></header>
<div class="bar"><div class="in">
 <span class="seg" id="mix"><button data-m="both" class="on">人聲＋鼓</button><button data-m="voc">只人聲</button><button data-m="drum">只鼓</button></span>
 <span>速度倍率 <input type="range" id="spd" min="20" max="120" value="100" step="5"> <b id="spdv">100%</b></span>
 <label><input type="checkbox" id="click"> 節拍器</label>
 <label><input type="checkbox" id="countin" checked> 先數 1 小節</label>
 <label><input type="checkbox" id="loop" checked> 循環</label>
 <label><input type="checkbox" id="showgrid" checked> 顯示格子</label>
 <button class="btn" id="quizbtn">🎲 節奏型考我</button>
</div></div>
<main id="main"><div id="quizbox"></div></main>
<footer><p>格子圖例：一列＝一小節，深色＝唱字的起點（格內是字），淺色＝拉長，藍色粗線＝小節開頭，灰線＝每一拍。最上面標「起拍」的那列是從上一小節尾巴（第 4 拍後半）進來的字。</p><p>練習建議：先用 50%～70% 速度只聽，再開「🥁 打拍子」跟著點，最後用 100% 跟原曲唱。</p></footer>

 nextT=ctx.currentTime+.08;timer=setInterval(sched,25);sched();raf=requestAnimationFrame(draw)}
function setBtn(i){const c=$("c"+i);if(!c)return;const on=cur===i;c.querySelector(".play").textContent=on&&!chainOn?"■ 停止":"▶ 播放";const b=c.querySelector(".chain");if(b)b.textContent=on&&chainOn?"■ 停止接龍":"🔗 接龍"}
function showStage(){const p=P[cur],c=$("c"+cur);if(!c)return;const s=c.querySelector(".chs");
 s.textContent=chainOn?`🔗 接龍：${stage?"第 1～"+(stage+1)+" 句":"第 1 句"}（第 ${rep+1}/2 次${stage===p.bounds.length-1?"，整段":""}）`:"";
 c.querySelectorAll(".lines li").forEach(li=>li.style.opacity=chainOn&&+li.dataset.k>stage?.35:1)}
function stop(){if(cur<0)return;clearInterval(timer);cancelAnimationFrame(raf);const c=$("c"+cur);c.classList.remove("playing");const i=cur;cur=-1;setBtn(i);chainOn=false;
 c.querySelector(".chs").textContent="";c.querySelectorAll(".lines li").forEach(li=>{li.style.opacity=1;li.classList.remove("now")});
 document.querySelectorAll(".cell.now").forEach(x=>x.classList.remove("now"));visQ=[];const cb=onEnd;onEnd=null;if(cb)cb()}
function sing(p,gs,t,sd){const j=p.noteAt[gs];if(j===undefined)return;if(mix!=="drum")voice(t,p.notes[j].len*sd,p.mel[j],(gs-p.pk)%p.sub===0,p.vw[j],true);if(window.TAP)TAP.expect(t,j,gs)}
function drums(p,gs,t){if(mix==="voc")return;if(p.K[gs]==="x")kick(t);if(p.S[gs]==="x")snare(t);if(p.H[gs]==="x")hat(t,(gs-p.pk)%p.sub===0)}
function more(p){return $("loop").checked||(chainOn&&(stage<p.bounds.length-1||rep<1))}
function sched(){const p=P[cur];while(nextT<ctx.currentTime+.12){const beat=60/bpmOf(p),sd=beat/p.sub,n4=p.sub*4;let vis=-1;
 if(ph==="count"||ph==="breath"){
  if(ps%p.sub===0)(ph==="count"||$("click").checked)&&clickS(nextT,ps===0);
  if(ph==="breath"&&mix!=="voc"&&ps%(p.sub/2)===0)hat(nextT,ps%p.sub===0);
  if(ps>=n4-p.pk){const gs=ps-(n4-p.pk);sing(p,gs,nextT,sd);vis=gs}
  ps++;if(ps>=n4){ph="main";step=p.pk}
 }else{
  if(step>=E){const atBreath=p.breath[stage],last=p.bounds.length-1;rep++;let cont;
   if(chainOn){if(rep>=2&&stage<last){stage++;rep=0;cont=true}else if(rep>=2){cont=$("loop").checked;rep=0}else cont=true}else cont=$("loop").checked;
   if(!cont){const t=nextT;setTimeout(()=>{if(cur>=0&&P[cur]===p)stop()},(t-ctx.currentTime)*1000+200);nextT=1e9;return}
   E=p.bounds[stage];const tt=nextT;setTimeout(()=>{if(cur>=0&&P[cur]===p)showStage()},Math.max(0,(tt-ctx.currentTime)*1000));
   if(atBreath&&p.pk){ph="breath";ps=0;continue}step=p.pk}
  const s=step;drums(p,s,nextT);
  const ov=p.pk&&!p.breath[stage]&&s>=E-p.pk&&more(p);
  if(ov){sing(p,s-(E-p.pk),nextT,sd)}else{const j=p.noteAt[s];if(j!==undefined&&p.li[j]<=stage)sing(p,s,nextT,sd)}
  if($("click").checked&&(s-p.pk)%p.sub===0)clickS(nextT,p.barSet.has(s));
  vis=ov?s-(E-p.pk):s;step++}
 visQ.push({t:nextT,s:vis});nextT+=sd}}
function draw(){if(cur<0)return;const now=ctx.currentTime;let s=null;while(visQ.length&&visQ[0].t<=now)s=visQ.shift().s;
 if(s!==null){const p=P[cur],c=$("c"+cur);c.querySelectorAll(".cell.now").forEach(x=>x.classList.remove("now"));if(s>=0){c.querySelectorAll(".cell").forEach(e=>{if(s>=+e.dataset.a&&s<+e.dataset.b)e.classList.add("now")});
  let li=-1;for(const n of p.notes)if(s>=n.st&&s<n.st+n.len){li=p.li[p.noteAt[n.st]];break}if(li>=0)c.querySelectorAll(".lines li").forEach(x=>x.classList.toggle("now",+x.dataset.k===li))}}
 raf=requestAnimationFrame(draw)}
/* 節奏型盲聽測驗（只考「節奏型」那一組） */
const qb=$("quizbox"),QI=P.map((p,i)=>p.g==="type"?i:-1).filter(i=>i>=0);let qi=-1;
$("quizbtn").onclick=()=>{document.body.classList.add("quizmode");newQ();qb.scrollIntoView({behavior:"smooth"})};
function newQ(){stop();let n;do{n=QI[Math.floor(Math.random()*QI.length)]}while(n===qi&&QI.length>1);qi=n;const o=new Set([n]);while(o.size<Math.min(4,QI.length))o.add(QI[Math.floor(Math.random()*QI.length)]);const arr=[...o].sort(()=>Math.random()-.5);
 qb.innerHTML=`<b>🎲 盲聽測驗</b>：這是哪一種節奏型？（先把「顯示格子」關掉再聽）<div style="margin-top:8px"><button class="btn play" id="qplay">▶ 播放題目</button> <button class="btn" id="qnext">換一題</button> <button class="btn" id="qclose">關閉</button></div><div class="opts">${arr.map(k=>`<button class="btn" data-k="${k}">${P[k].t}</button>`).join("")}</div><div id="qres" style="margin-top:8px"></div>`;
 $("qplay").onclick=()=>{if(cur===qi){stop();$("qplay").textContent="▶ 播放題目";return}toggle(qi,()=>{$("qplay")&&($("qplay").textContent="▶ 播放題目")});$("qplay").textContent="■ 停止"};
 $("qnext").onclick=newQ;$("qclose").onclick=()=>{stop();document.body.classList.remove("quizmode")};
 qb.querySelectorAll(".opts .btn").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;qb.querySelectorAll(".opts .btn").forEach(x=>{if(+x.dataset.k===qi)x.classList.add("right")});if(k!==qi)b.classList.add("wrong");
  $("qres").innerHTML=(k===qi?"✅ 答對了！":"❌ 再聽聽看。")+` 正解是 <b>#${qi+1} ${P[qi].t}</b>，<a href="#c${qi}">跳到該卡片</a>。`})}
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();if(cur>=0)stop()}});
</script>
